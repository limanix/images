name: PR flow

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/markdown/fmt

  nix:
    uses: mr-chelyshkin/actions/.github/workflows/pr-nix.yml@v1
    permissions:
      contents: read

  image:
    name: Image (${{ matrix.arch }})
    needs: [markdown, nix]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, runner: ubuntu-24.04-arm }
          - { arch: x86_64, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allow user namespaces for systemd-repart
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the image
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: release/build ARCH=${{ matrix.arch }}

  gate:
    if: always()
    needs: [markdown, nix, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: mr-chelyshkin/actions/check-job-results@v1
        with:
          results: ${{ toJSON(needs) }}
