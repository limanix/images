name: Release

on:
  push:
    branches: [main]
    paths: [flake.lock]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: aarch64, runner: ubuntu-24.04-arm }
          - { arch: x86_64, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allow user namespaces for systemd-repart
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the image
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: release/build ARCH=${{ matrix.arch }}
      - name: Keep the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: dist
          merge-multiple: true
      - name: Prepare the release
        id: release
        run: bash scripts/release.sh >> "$GITHUB_OUTPUT"
      - name: Publish ${{ steps.release.outputs.tag }}
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: legacy
          files: |
            dist/*.qcow2
            dist/*.qcow2.sha256
      - name: Move ${{ steps.release.outputs.alias }}
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ALIAS: ${{ steps.release.outputs.alias }}
        run: >-
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$ALIAS" -f sha="$GITHUB_SHA" -F force=true ||
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$ALIAS" -f sha="$GITHUB_SHA"
      - name: Publish ${{ steps.release.outputs.alias }}
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.alias }}
          name: ${{ steps.release.outputs.alias }}
          body: The newest image of NixOS ${{ steps.release.outputs.alias }}, currently ${{ steps.release.outputs.tag }}. Pin a dated release instead of this one.
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            alias/*.qcow2
            alias/*.qcow2.sha256
